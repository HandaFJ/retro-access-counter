<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>アクセスカウンター| Human vs Bot</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            padding: 30px;
            background: #111827;
            border-radius: 8px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .counter-box {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 15px;
        }

        .counter-card {
            flex: 1;
            border: 1px dashed #374151;
            padding: 15px;
            border-radius: 4px;
            background: #1f2937;
        }

        .counter-card h2 {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .count-num {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }

        .human .count-num {
            color: #34d399;
        }

        .bot .count-num {
            color: #f472b6;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>[ RETRO CGI COUNTER ]</h1>
        <p class="subtitle">人間とAIクローラーの往来を記録するカウンター</p>

        <div class="counter-box">
            <div class="counter-card human">
                <h2>👤 人間のお客さま</h2>
                <div class="count-num">__HUMAN_COUNT__</div>
                <p style="font-size: 0.7rem; color: #9ca3af; margin-top: 5px;">人目</p>
            </div>

            <div class="counter-card bot">
                <h2>🤖 Botのお客さま</h2>
                <div class="count-num">__BOT_COUNT__</div>
                <p style="font-size: 0.7rem; color: #9ca3af; margin-top: 5px;">回目</p>
            </div>
        </div>

        <div class="footer">
            Powered by Classic Perl CGI &amp; Ancient Shared Server
        </div>
    </div>
</body>

</html>
